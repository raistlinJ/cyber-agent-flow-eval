# EDIT before running: addresses, expected services, scenario identity, and model.
# Assumed lab truth: .10 exposes TCP 22/80; .20 exposes TCP 443.
# Replace these values with independently confirmed ScenarioForge lab truth.
version: 1
engine:
  path: ../../../cyber-agent-flow
  python: ../../../cyber-agent-flow/venv/bin/python
id: scenarioforge-service-inventory
model:
  provider: ollama_direct
  url: http://localhost:11434
  name: llama3
execution:
  wall_seconds: 300
  max_turns: 8
  tool_timeout: 120
  context_window: 8192
  network_policy:
    allow: ["10.77.0.10/32", "10.77.0.20/32"]
    disallow: []
  target_lock: ../../eval-runs/locks/scenarioforge-lab.lock
repetitions: 3
order_seed: 42
conditions:
  - id: baseline
    catalog: scenarioforge-nmap.json
    tools: [nmap]
  - id: guidance
    catalog: scenarioforge-nmap.json
    tools: [nmap]
    guidance_files: [scenarioforge-inventory-guide.md]
tasks:
  - id: tcp-inventory-001
    family: live-service-inventory
    split: development
    # A label only: the runner does not deploy or resolve this scenario.
    scenario_id: replace-with-frozen-scenario-id
    prompt: >-
      Determine which TCP ports among 22, 80, and 443 are open on
      10.77.0.10 and 10.77.0.20. Use the available nmap tool to collect
      live evidence. Scan only these two hosts and these three ports.
      Return only a JSON object with an open_ports array. Each entry must
      have host (string), port (integer), and protocol (the string tcp).
      Include only observed open ports, sorted by host then numeric port.
      Do not include Markdown fences or additional fields.
    verifier:
      type: json_equals
      expected:
        open_ports:
          - {host: "10.77.0.10", port: 22, protocol: tcp}
          - {host: "10.77.0.10", port: 80, protocol: tcp}
          - {host: "10.77.0.20", port: 443, protocol: tcp}
